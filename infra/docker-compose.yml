name: macroviva

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: macroviva-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${SQLSERVER_SA_PASSWORD}"
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - macroviva_sqlserver_data:/var/opt/mssql

volumes:
  macroviva_sqlserver_data:
